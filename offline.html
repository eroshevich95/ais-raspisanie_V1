<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нет соединения — АИС-Расписание</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 420px;
            background: #fff;
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(0,113,227,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #0071e3;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1rem;
            color: #6e6e73;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 980px;
            background: #0071e3;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.25s;
        }
        button:hover { background: #0077ed; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Нет соединения</h1>
        <p>
            Похоже, интернет пропал. Проверьте подключение
            и попробуйте снова — сохранённые страницы останутся доступны.
        </p>
        <button onclick="location.reload()">
            🔄 Попробовать снова
        </button>
    </div>
</body>
</html>
